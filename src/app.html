<title>Pool Shot Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-column phone app. Sticky tab bar, a height-limited to-scale table, controls stacked under it. */
:root {
  --bg: #eef1f3;
  --panel: #ffffff;
  --ink: #161a1e;
  --muted: #5b646d;
  --line: #d6dce1;
  --accent: #1d66c4;      /* chalk blue */
  --accent-ink: #ffffff;
  --accent-soft: #dce9f8;
  --good: #1a7f48;
  --warn: #a8690f;
  --bad: #b8382f;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  /* The table is drawn in the user's real colours (grey cloth) in both themes */
  --cloth: #8a9399;
  --cushion: #737c82;
  --rail: #2b2723;
  --pocket: #0c0c0c;
  --diamond: #efe6cf;
  --marker: #a9d8ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101316; --panel: #191d21; --ink: #e8ecef; --muted: #9aa3ab; --line: #2b3238;
    --accent: #5b9ff0; --accent-ink: #08111d; --accent-soft: #1b2b40;
    --good: #4cb97f; --warn: #d8a344; --bad: #e46b61;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101316; --panel: #191d21; --ink: #e8ecef; --muted: #9aa3ab; --line: #2b3238;
  --accent: #5b9ff0; --accent-ink: #08111d; --accent-soft: #1b2b40;
  --good: #4cb97f; --warn: #d8a344; --bad: #e46b61;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Header + tabs */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand .store { font-size: 12px; color: var(--muted); text-align: right; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: none; border-radius: 7px; padding: 7px 4px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* Log view */
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.drill { display: flex; gap: 8px; align-items: center; }
.drill input { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; }
.badge { font-family: var(--f-display); font-weight: 700; font-size: 18px; padding: 4px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
.tablewrap { position: relative; display: flex; justify-content: center; }
#tbl { display: block; height: min(60vh, calc((100vw - 32px) * 1.8)); max-width: 100%; aspect-ratio: 59 / 109; touch-action: none; user-select: none; -webkit-user-select: none; }
.loupe { position: absolute; top: 6px; width: 132px; height: 132px; border-radius: 50%; overflow: hidden; border: 3px solid var(--panel); box-shadow: 0 4px 18px rgba(0,0,0,.35); pointer-events: none; background: var(--rail); }
.loupe svg { width: 100%; height: 100%; display: block; }
.hint { font-size: 13px; color: var(--muted); min-height: 1.4em; text-align: center; }
.hintrow { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.hintrow .chips { width: 100%; justify-content: center; }
.chip.sm { padding: 5px 10px; font-size: 13px; }
.sessionline { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.colA, .colB { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.drill select { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; font-weight: 600; }
.drillinfo { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); }
.drillinfo p { margin: 0; min-width: 0; }
.drillform { display: flex; gap: 8px; flex-wrap: wrap; }
.drillform input { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; }
/* Landscape: table turned sideways on the left, controls in a column on the right */
body.land .app { max-width: 1180px; }
body.land .top { flex-direction: row; align-items: center; gap: 16px; padding-block: 6px; }
body.land .brand h1 { font-size: 22px; white-space: nowrap; }
body.land .brand .store { display: none; }
body.land .tabs { flex: 1; max-width: 460px; margin-left: auto; }
body.land #view-log { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 18px; align-items: start; }
body.land .colA { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); gap: 8px; }
body.land #tbl { height: auto; width: min(100%, calc((100dvh - 84px) * 109 / 59)); }
body.land .tiles { grid-template-columns: repeat(5, 1fr); }
body.land .tile:first-child { grid-column: auto; }
body.land #scatter { height: auto; width: min(100%, 680px); }
body.land .scwrap .chartbox { flex: 1 1 0; min-width: 0; }
body.land #scatter { width: 100%; }
body.land .picker { max-height: 380px; }
body.land #strip { max-width: 620px; margin: 0 auto; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tool { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tool svg { width: 22px; height: 22px; }
.tool[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.tool .set { font-weight: 400; font-size: 11px; }
.group { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.good[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.chip.warn[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #fff; }
.chip.bad[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.pocketline { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.pocketline .what { font-size: 14px; }
.pocketline .what b { font-family: var(--f-display); font-size: 18px; letter-spacing: .02em; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.big { padding: 14px; font-size: 17px; font-family: var(--f-display); letter-spacing: .04em; text-transform: uppercase; flex: 1; }
.btn:disabled { opacity: .45; cursor: default; }
.savebar { display: flex; gap: 8px; }
textarea, .field input, .field select { width: 100%; padding: 9px 11px; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; }
textarea { resize: vertical; min-height: 42px; }

/* Pocket zoom sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet .card { width: 100%; max-width: 560px; background: var(--panel); border-radius: 16px 16px 0 0; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; max-height: 100%; overflow: auto; }
.sheet h2 { margin: 0; font-family: var(--f-display); text-transform: uppercase; font-size: 22px; letter-spacing: .03em; }
#zoom { width: 100%; height: auto; aspect-ratio: 14 / 11; max-height: 52vh; background: var(--rail); border-radius: 10px; touch-action: none; display: block; }
.readout { font-size: 14px; }
.readout b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Stats */
.filters { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.app > *, section.app > * { min-width: 0; }
/* views sit inside the outer column: fill it rather than shrink-wrapping their content */
section.app { margin: 0; width: 100%; max-width: none; }
select { max-width: 100%; }
.filters select { width: 100%; max-width: 100%; min-width: 0; text-overflow: ellipsis; padding: 8px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.tile:first-child { grid-column: span 2; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.tile .v { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 16px; font-weight: 600; color: var(--muted); }
.tile .k { font-size: 12px; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.panel h3 { margin: 0; font-size: 15px; font-weight: 600; text-wrap: balance; }
.panel .sub { font-size: 12px; color: var(--muted); margin-top: -4px; }
.scroll { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { padding: 6px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t th { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
table.t td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
table.t td:first-child { font-family: var(--f-body); font-weight: 500; }
.chartbox { display: flex; justify-content: center; }
#scatter { height: min(52vh, 460px); max-width: 100%; aspect-ratio: 59 / 109; display: block; }
.scwrap { display: flex; gap: 10px; align-items: flex-start; justify-content: center; min-width: 0; }
.scwrap .chartbox { flex: 0 1 auto; min-width: 0; }
.picker { flex: 0 0 116px; max-height: min(52vh, 460px); overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 2px; overscroll-behavior: contain; }
.picker button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 8px; font-size: 12px; line-height: 1.3; display: flex; flex-direction: column; gap: 1px; }
.picker button b { font-family: var(--f-display); font-size: 15px; letter-spacing: .02em; }
.picker button span { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.picker button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.picker button[aria-pressed="true"] span { color: inherit; }
.shotbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.shotbar .tip { flex: 1 1 100%; }
#strip { width: 100%; height: auto; display: block; }
.tip { font-size: 13px; color: var(--muted); min-height: 1.4em; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }

/* Shots list */
.shotlist { display: flex; flex-direction: column; gap: 6px; }
.shot { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; }
.shot .n { font-family: var(--f-display); font-weight: 700; font-size: 20px; grid-row: span 2; min-width: 2ch; text-align: center; }
.shot .l1 { font-weight: 600; font-size: 14px; min-width: 0; }
.shot .l2 { font-size: 12px; color: var(--muted); min-width: 0; }
.shot .del { grid-row: span 2; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; display: flex; flex-direction: column; gap: 12px; align-items: center; background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; }
.empty p { margin: 0; max-width: 40ch; }

/* Settings */
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; z-index: 30; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .18s ease-out; } @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Pool Shot Log</h1><div class="store" id="storeNote">Saved on this device</div></div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-log" aria-selected="true" data-view="log">Log</button>
      <button role="tab" id="tab-stats" aria-selected="false" data-view="stats">Stats</button>
      <button role="tab" id="tab-shots" aria-selected="false" data-view="shots">Shots</button>
      <button role="tab" id="tab-table" aria-selected="false" data-view="table">Table</button>
    </nav>
  </header>

  <!-- LOG -->
  <section id="view-log" class="app">
    <div class="colA">
    <div class="drill">
      <select id="drillSel" aria-label="Drill"></select>
      <span class="badge" id="shotNo">Shot 1</span>
    </div>
    <div class="drill" id="freeRow">
      <input id="drill" placeholder="Name this session (optional)" aria-label="Session name" autocomplete="off">
      <button class="btn" id="saveDrill">Save as drill</button>
    </div>
    <div class="drillinfo" id="drillInfo" hidden></div>
    <div class="tablewrap" id="tablewrap">
      <svg id="tbl" role="img" aria-label="Pool table. Tap to place balls and markers."></svg>
      <div class="loupe" id="loupe" hidden><svg id="loupeSvg"><g id="loupeRot"><use href="#tblContent"></use></g><g id="loupeX"></g></svg></div>
    </div>
    <div class="hintrow"><span class="hint" id="hint"></span><button class="btn small" id="removeItem" hidden></button><div class="chips" id="zoneChips" hidden></div></div>
    <div class="tools" id="tools"></div>
    </div>
    <div class="colB">
    <div class="pocketline">
      <div class="what" id="pocketWhat"></div>
      <button class="btn primary" id="openZoom">Mark pocket entry</button>
    </div>
    <div class="group"><span class="label">Pocket result</span><div class="chips" id="outcomeChips"></div></div>
    <div class="group"><span class="label">Vertical spin</span><div class="chips" id="vspinChips"></div></div>
    <div class="group"><span class="label">Side spin</span><div class="chips" id="sideChips"></div></div>
    <div class="group"><span class="label">Speed</span><div class="chips" id="speedChips"></div></div>
    <div class="group"><label class="label" for="notes">Note for this shot</label><textarea id="notes" rows="1" placeholder="Optional"></textarea></div>
    <div class="sessionline"><span id="sessionText"></span><button class="btn small" id="newSession">New session</button></div>
    <div class="savebar">
      <button class="btn" id="undo">Undo last</button>
      <button class="btn primary big" id="save">Save shot</button>
    </div>
    </div>
  </section>

  <!-- STATS -->
  <section id="view-stats" class="app" hidden></section>

  <!-- SHOTS -->
  <section id="view-shots" class="app" hidden></section>

  <!-- TABLE SETTINGS -->
  <section id="view-table" class="app" hidden></section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="zoomTitle">
    <h2 id="zoomTitle">Pocket entry</h2>
    <p class="note">Drag the object ball to where its centre crossed the pocket mouth. The view is turned so the ball travels up the screen, so left and right are as you saw it.</p>
    <svg id="zoom" viewBox="-7 -6 14 11"><g id="zRot"><use href="#tblContent"></use><g id="zDyn"></g></g></svg>
    <div class="readout" id="zRead"></div>
    <div class="chips" id="zOutcome"></div>
    <div class="savebar">
      <button class="btn" id="zClear">Clear</button>
      <button class="btn primary big" id="zDone">Done</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
/* ---------- constants ---------- */
const R_BALL = 1.125;          // 2 1/4 in ball
const RAIL = 4.5;              // drawn rail width, inches
const VSPIN = [["draw","Draw"],["stun","Stun"],["stunrun","Stun-run"],["centre","Centre ball"],["follow","Follow"]];
const SIDE = [["L","Left"],["C","Centre"],["R","Right"]];
const SPEED = [[1,"Soft"],[2,"Medium"],[3,"Firm"],[4,"Power"]];
const OUTCOME = [["made","Made","good"],["rattled","Rattled out","warn"],["missed","Missed","bad"]];
const POCKET_NAMES = { HL:"Head left", HR:"Head right", SL:"Side left", SR:"Side right", FL:"Foot left", FR:"Foot right" };
const TOOLS = [
  ["cb","Cue ball"],["ob","Object ball"],["target","CB target"],["result","CB result"]
];
const HINTS = {
  cb: "Tap or drag to set where the cue ball starts.",
  ob: "Tap or drag to set the object ball. Tap a pocket to aim at it.",
  target: "Tap where you want the cue ball to finish.",
  result: "Tap where the cue ball actually stopped. Drag to fine-tune."
};
const ZONES = [["point", "Point"], ["c3", "3 in circle"], ["c6", "6 in circle"], ["half", "Half-diamond box"], ["dia", "Diamond box"]];
const SESSION_GAP_MS = 2 * 3600e3;
const LS = { shots: "psl.shots.v1", work: "psl.work.v1", settings: "psl.settings.v1", drills: "psl.drills.v1" };

/* ---------- storage helpers ---------- */
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const settings = Object.assign({ W: 50, L: 100, wc: 4.25, ws: 4.75, grid: "8x4", labels: false }, ls.get(LS.settings, {}));
const S = Object.assign({
  drill: "", drillId: "", tz: "point", sessionId: "", sessionStart: "", lastShotTs: 0, vspin: "stun", side: "C", speed: 2, pocket: "FR", tool: "result",
  cb: { x: 20, y: 52 }, ob: { x: 40, y: 82 }, target: { x: 30, y: 70 }, result: null, entry: null, outcome: null, notes: ""
}, ls.get(LS.work, {}));
let shots = ls.get(LS.shots, []);
if (!Array.isArray(shots)) shots = [];
let myDrills = ls.get(LS.drills, []);
if (!Array.isArray(myDrills)) myDrills = [];
/* Starter drills. Coordinates in inches: x from the left cushion, y from the head cushion. */
const DIAG = (t) => ({ x: Math.round(5000 * t) / 100, y: Math.round(10000 * t) / 100 });          // on the HL-FR diagonal
const GHOST_STR = { x: 36.99, y: 73.99 };                          // cue ball centre at contact for the OB at 3/4 diagonal
const STARTER = [
  { id: "s-stop", name: "Stop shot, straight in", desc: "Straight in to the foot-right corner. Stop the cue ball dead where it hits the object ball.",
    cb: DIAG(.5), ob: DIAG(.75), target: GHOST_STR, tz: "c3", pocket: "FR", vspin: "stun", side: "C", speed: 2 },
  { id: "s-stunrun", name: "Stun-run 1 ft, straight in", desc: "Same straight shot. Let the cue ball roll on one foot past contact.",

/* ---------- examples ---------- */
function exampleShots() {

  const P = pockets(); const out = []; const now0 = Date.now();
  const drills = [
    { name: "Example: stun to side rail", vspin: "stun", cb: { x: 25, y: 50 }, ob: { x: 40, y: 82 }, target: { x: 30, y: 70 }, tz: "c6", sdv: 3 },
    { name: "Example: draw back to head", vspin: "draw", cb: { x: 25, y: 60 }, ob: { x: 38, y: 84 }, target: { x: 18, y: 40 }, tz: "dia", sdv: 5 }
  ];
  let k = 0;
  for (const d of drills) for (let i = 0; i < 10; i++) {
    const day = i < 5 ? 1 : 0; const base = now0 - day * 86400e3 - 3600e3; const sesId = "ses-example-" + day;
    const pk = P.FR; const result = clampBall({ x: d.target.x + gauss() * d.sdv, y: d.target.y + gauss() * d.sdv * 1.3 });
    const dir = unit(sub(pk.c, d.ob)); const right = { x: dir.y, y: -dir.x };
    const offv = .15 + gauss() * .7; const entry = add(pk.c, mul(right, offv));
    const outcome = Math.abs(offv) < .85 ? "made" : Math.abs(offv) < 1.25 ? "rattled" : "missed";
    const err = sub(result, d.target); const t = new Date(base + (k++) * 90e3); const z = zoneShape(d.target, d.tz);
    out.push({
      id: uid() + k, ts: t.toISOString(), session: sesId, tz: d.tz, inZone: inZone(result, z) ? 1 : 0, local: t.toISOString().slice(0, 16).replace("T", " "), drill: d.name, shotNo: i + 1,
      vspin: d.vspin, side: "C", speed: 2, pocket: "FR", cb: d.cb, ob: d.ob, target: d.target,
      result: { x: r2(result.x), y: r2(result.y) }, entry: { x: r2(entry.x), y: r2(entry.y) }, outcome,
      cut: r2(cutAngle(d.cb, d.ob, pk)), obDist: r2(len(sub(pk.c, d.ob))), cbErr: r2(len(err)), cbDx: r2(err.x), cbDy: r2(err.y),

    });
  }

}
